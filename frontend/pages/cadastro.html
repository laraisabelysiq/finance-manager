
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f9fc">
    <meta name="description" content="Crie sua conta Finance Manager e comece a organizar suas finanças.">

    <title>Criar conta | Finance Manager</title>

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
    <header class="auth-header">
        <a class="brand" href="../index.html" aria-label="Finance Manager - Página inicial">
            <span class="brand-icon" aria-hidden="true">F</span>
            <span>finance<span class="brand-highlight">manager</span></span>
        </a>

        <a class="back-link" href="../index.html">← Página inicial</a>
    </header>

    <main class="auth-main">
        <section class="auth-container" aria-labelledby="register-title">
            <div class="auth-heading">
                <span class="auth-symbol" aria-hidden="true">F</span>
                <h1 id="register-title">Crie sua conta</h1>
                <p>Comece a organizar suas receitas e despesas em um só lugar.</p>
            </div>

            <form id="register-form" class="auth-form" novalidate>
                <div
                    id="auth-message"
                    class="auth-message"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></div>

                <div class="form-field">
                    <label class="form-label" for="name">Nome completo</label>
                    <input
                        class="form-input"
                        id="name"
                        name="name"
                        type="text"
                        placeholder="Como podemos te chamar?"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-field">
                    <label class="form-label" for="email">E-mail</label>
                    <input
                        class="form-input"
                        id="email"
                        name="email"
                        type="email"
                        placeholder="voce@exemplo.com"
                        autocomplete="email"
                        maxlength="254"
                        required
                    >
                </div>

                <div class="form-field">
                    <label class="form-label" for="password">Senha</label>

                    <div class="form-input-wrapper">
                        <input
                            class="form-input password-input"
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Crie uma senha"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            class="password-toggle"
                            type="button"
                            data-toggle-password="password"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                        >
                            Mostrar
                        </button>
                    </div>

                    <small class="form-hint">
                        Use pelo menos 8 caracteres. A senha não pode ultrapassar
                        72 bytes em UTF-8.
                    </small>
                </div>

                <div class="form-field">
                    <label class="form-label" for="confirm-password">
                        Confirmar senha
                    </label>

                    <div class="form-input-wrapper">
                        <input
                            class="form-input password-input"
                            id="confirm-password"
                            name="confirm-password"
                            type="password"
                            placeholder="Digite a senha novamente"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            class="password-toggle"
                            type="button"
                            data-toggle-password="confirm-password"
                            aria-label="Mostrar confirmação da senha"
                            aria-pressed="false"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <button class="button button-primary auth-submit" type="submit">
                    Criar minha conta
                </button>
            </form>

            <p class="auth-switch">
                Já tem uma conta?
                <a href="./login.html">Entrar</a>
            </p>
        </section>
    </main>

    <footer class="auth-footer">
        Finance Manager · Controle financeiro pessoal
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
